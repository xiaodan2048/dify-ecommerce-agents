{"app": {"name": "内容Agent-演示", "mode": "workflow", "icon": "✍️", "icon_background": "#FFEAD5", "description": "元养（虚构品牌）种草内容：商品理解Agent → 内容生成Agent → 合规审核Agent 固定编排，卖点可溯源、规则+模型双重合规。", "use_icon_as_answer_icon": false}, "kind": "app", "version": "0.3.0", "dependencies": [], "workflow": {"conversation_variables": [], "environment_variables": [], "features": {"file_upload": {"enabled": false}, "opening_statement": "", "retriever_resource": {"enabled": false}, "sensitive_word_avoidance": {"enabled": false}, "speech_to_text": {"enabled": false}, "suggested_questions": [], "suggested_questions_after_answer": {"enabled": false}, "text_to_speech": {"enabled": false}}, "graph": {"nodes": [{"id": "start", "type": "custom", "data": {"type": "start", "title": "开始", "desc": "", "variables": [{"variable": "product", "label": "商品", "type": "select", "options": ["P01 维生素C咀嚼片（保健食品）", "P02 乳清蛋白粉（普通食品）", "P03 辅酶Q10软胶囊（保健食品）", "P04 益生菌固体饮料（普通食品）", "P05 胶原蛋白肽饮（普通食品）"], "required": true, "max_length": 48}, {"variable": "platform", "label": "平台", "type": "select", "options": ["小红书笔记", "抖音脚本", "详情页卖点"], "required": true, "max_length": 48}, {"variable": "note", "label": "运营补充要求（可不填）", "type": "paragraph", "required": false, "max_length": 500}], "selected": false}, "position": {"x": 80, "y": 280}, "positionAbsolute": {"x": 80, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "a_data", "type": "custom", "data": {"type": "code", "title": "A 商品资料与规则库", "desc": "取出带编号的参数和评价；输出合规规则库", "code_language": "python3", "code": "# 节点A 商品资料与规则库（代码执行）\n# 作用：按选中的商品取出「参数 + 买家评价 + 资质」，每条都带编号，后面的卖点必须引用这些编号。\n#       同时输出合规规则库，给后面的「卖点溯源校验」「合规规则检查」「终稿复检」共用。\n# 所有品牌、商品、批准文号、评价都是虚构的演示数据。\nimport json\n\nBRAND = {\n    \"品牌\": \"元养\",\n    \"调性\": \"温和、专业、真诚，不夸大不制造焦虑；像懂营养的朋友在分享，而不是推销员在喊话\",\n    \"人群\": \"25-40 岁一二线城市上班族，关注日常营养，讨厌被忽悠\",\n}\n\nPRODUCTS = {\n    \"P01\": {\n        \"名称\": \"元养 维生素C咀嚼片（香橙味）\",\n        \"品类\": \"营养素补充剂\",\n        \"资质类型\": \"保健食品\",\n        \"批准文号\": \"国食健注G20990001（虚构）\",\n        \"批准功效\": [\"补充维生素C\"],\n        \"价格\": \"59元/瓶（60片）\",\n        \"参数\": [\n            \"每片含维生素C 100mg\",\n            \"规格：1.2g×60片，每日1片，嚼服\",\n            \"香橙味，甜味来自木糖醇，不添加蔗糖\",\n            \"适宜人群：需要补充维生素C的成人\",\n            \"不适宜人群：少年儿童、孕妇、乳母\",\n            \"瓶身小巧，高约8cm，可放进通勤包\",\n        ],\n        \"评价\": [\n            \"很好嚼，不粘牙，像小时候吃的橙子糖\",\n            \"酸甜口，不会齁，办公室同事都问我要\",\n            \"瓶子小，放包里每天想起来就吃一片\",\n            \"吃了一个多月，感觉感冒都少了，抵抗力变好了\",\n            \"皮肤好像也变白了一点，不知道是不是心理作用\",\n            \"比药店买的便宜，60片能吃两个月\",\n            \"无糖这点很加分，控糖期也敢吃\",\n            \"物流很快，第二天就到了\",\n        ],\n    },\n    \"P02\": {\n        \"名称\": \"元养 乳清蛋白粉（香草味，固体饮料）\",\n        \"品类\": \"固体饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"199元/罐（900g，约30份）\",\n        \"参数\": [\n            \"每份30g含蛋白质24g\",\n            \"蛋白来源：进口浓缩乳清蛋白\",\n            \"不添加蔗糖，香草味\",\n            \"冷水、温水都能冲，摇杯摇10秒即可溶开\",\n            \"规格：900g/罐，内附量勺\",\n            \"食用建议：运动后或早餐时冲饮1份\",\n        ],\n        \"评价\": [\n            \"冷水一摇就开，没有结块，这点比之前买的强\",\n            \"香草味很淡，不腻，加进燕麦里也好喝\",\n            \"健身完喝一杯，很方便\",\n            \"早餐来不及吃，冲一杯能顶到中午\",\n            \"喝了一个月，换季居然没感冒，感觉抵抗力好了\",\n            \"比某大牌便宜一半，品质差不多\",\n            \"罐子密封好，勺子放在盖子卡槽里不会埋在粉里\",\n            \"蛋白含量写得很清楚，24克一份算高的\",\n        ],\n    },\n    \"P03\": {\n        \"名称\": \"元养 辅酶Q10软胶囊\",\n        \"品类\": \"保健食品（功能声称类）\",\n        \"资质类型\": \"保健食品\",\n        \"批准文号\": \"国食健注G20990003（虚构）\",\n        \"批准功效\": [\"有助于抗氧化\"],\n        \"价格\": \"168元/瓶（60粒）\",\n        \"参数\": [\n            \"每粒含辅酶Q10 50mg\",\n            \"规格：0.5g×60粒，每日1粒，随餐吞服\",\n            \"软胶囊，粒径小，易吞咽\",\n            \"保健功能：有助于抗氧化\",\n            \"不适宜人群：少年儿童、孕妇、乳母\",\n            \"瓶盖有防伪码，可扫码查验\",\n        ],\n        \"评价\": [\n            \"胶囊很小，一口就吞下去了\",\n            \"没有怪味，打嗝也没有味道\",\n            \"最近经常熬夜加班，吃了感觉精神好一些，没那么累了\",\n            \"我爸心脏不太好，吃了之后说胸口舒服多了\",\n            \"扫了防伪码，能查到批次，放心\",\n            \"一天一粒，记得住，不麻烦\",\n            \"包装简洁，送长辈也拿得出手\",\n            \"客服回复很专业，问了适不适合我妈吃\",\n        ],\n    },\n    \"P04\": {\n        \"名称\": \"元养 益生菌固体饮料（酸奶味）\",\n        \"品类\": \"固体饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"89元/盒（2g×20条）\",\n        \"参数\": [\n            \"每条2g，出厂时益生菌活菌数≥100亿CFU\",\n            \"菌株：乳双歧杆菌、嗜酸乳杆菌\",\n            \"添加低聚果糖\",\n            \"酸奶味，可直接吃，也可用40℃以下温水冲\",\n            \"独立条装：2g×20条\",\n            \"常温储存，避免阳光直射\",\n        ],\n        \"评价\": [\n            \"酸奶味的，直接倒嘴里吃也好吃\",\n            \"小条装出差带着很方便\",\n            \"坚持喝了两周，便秘好多了，每天都很顺\",\n            \"生产日期很新鲜，是上个月的\",\n            \"温水冲开没有沉淀\",\n            \"家里人都爱吃这个口味\",\n            \"活菌数写在包装上，比较透明\",\n            \"一盒20条，一天一条刚好吃大半个月\",\n        ],\n    },\n    \"P05\": {\n        \"名称\": \"元养 胶原蛋白肽饮（樱桃味）\",\n        \"品类\": \"饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"129元/盒（50ml×10瓶）\",\n        \"参数\": [\n            \"每瓶50ml含胶原蛋白肽5000mg\",\n            \"添加维生素C\",\n            \"0脂肪，樱桃味\",\n            \"规格：50ml×10瓶\",\n            \"冷藏后口感更好，开封后请尽快饮用\",\n            \"小瓶玻璃装，礼盒包装\",\n        ],\n        \"评价\": [\n            \"樱桃味很好喝，一点都不腥\",\n            \"小瓶一口喝完，上班带一瓶刚好\",\n            \"喝了半个月，皮肤白了，眼角细纹也少了\",\n            \"礼盒很好看，送闺蜜很有面子\",\n            \"冰过之后更好喝，像果汁\",\n            \"5000mg的含量在同价位里算高的\",\n            \"玻璃瓶有点重，但是质感好\",\n            \"配料表挺干净的\",\n        ],\n    },\n}\n\n# ---------------- 合规规则库（真实业务里由法务维护，这里是演示版） ----------------\nRULES = {\n    \"说明\": \"规则能判的交给规则；模型只处理语义审核（暗示、夸大、诱导）。\",\n    # 广告法：绝对化用语\n    \"极限词\": [\n        r\"最(好|佳|强|优|棒|高|低|大|新|先进|安全|有效|便宜|划算|值)\",\n        r\"第一(?!次|步|口|天|周|个|瓶|片|条|粒|杯)\",\n        r\"顶级\", r\"极致\", r\"国家级\", r\"世界级\", r\"首选\", r\"唯一\", r\"独家\",\n        r\"100%\", r\"百分百\", r\"绝对\", r\"万能\", r\"史无前例\", r\"销量冠军\", r\"NO\\.?1\", r\"No\\.?1\", r\"王牌\", r\"无敌\",\n    ],\n    # 食品（含保健食品）一律不得涉及疾病预防、治疗\n    \"医疗用语\": [\n        r\"治疗\", r\"治愈\", r\"疗效\", r\"根治\", r\"药到病除\", r\"抗癌\", r\"防癌\", r\"降血压\", r\"降血糖\", r\"降血脂\", r\"降三高\",\n        r\"消炎\", r\"特效\", r\"药效\", r\"医治\", r\"病症\", r\"心脏(不好|病)\", r\"护心\", r\"保护心脏\", r\"心血管\",\n        r\"无副作用\", r\"零风险\", r\"安全无毒\",\n    ],\n    # 功效词 → 功效类别；商品「批准功效」里没有这个类别，就不能出现这些词\n    \"功效词\": {\n        \"增强免疫力\": [r\"免疫力\", r\"抵抗力\", r\"增强免疫\", r\"提高免疫\", r\"少感冒\", r\"不感冒\", r\"没感冒\", r\"不生病\", r\"防感冒\", r\"换季不怕\"],\n        \"调节肠道菌群/润肠通便\": [r\"肠道菌群\", r\"调节肠道\", r\"改善肠道\", r\"便秘\", r\"通便\", r\"润肠\", r\"排毒\", r\"清肠\", r\"宿便\", r\"排便\", r\"调理肠道\", r\"肠道健康\", r\"(?<!吞咽)(通畅|顺畅)\", r\"噗噗\", r\"嗯嗯\"],\n        \"抗氧化\": [r\"抗氧化\", r\"自由基\"],\n        \"缓解体力疲劳\": [r\"抗疲劳\", r\"缓解疲劳\", r\"消除疲劳\", r\"精力充沛\", r\"没那么累\", r\"不累\"],\n        \"美容类\": [r\"美白\", r\"变白\", r\"(?<![明说])白了\", r\"淡斑\", r\"祛斑\", r\"抗衰\", r\"抗老\", r\"抗皱\", r\"祛皱\", r\"细纹\", r\"紧致\", r\"逆龄\", r\"冻龄\", r\"嫩肤\"],\n        \"减肥类\": [r\"减肥\", r\"瘦身\", r\"燃脂\", r\"刮油\", r\"掉秤\"],\n        \"改善睡眠\": [r\"助眠\", r\"改善睡眠\", r\"失眠\", r\"睡得更好\"],\n        \"补充维生素C\": [r\"补充维生素C\", r\"补充VC\", r\"补VC\"],\n    },\n    # 批准功效原文 → 功效类别\n    \"批准功效映射\": {\"补充维生素C\": \"补充维生素C\", \"有助于抗氧化\": \"抗氧化\"},\n    # 贬低竞品\n    \"竞品对比\": [r\"(比|吊打|秒杀|碾压|完胜)(某|别家|其他家|大牌|同类|竞品)\", r\"大牌\", r\"(市面上|同类产品|其他品牌|别家).{0,15}(更|不如|没有|比不上)\", r\"智商税\"],\n    # 普通食品不能自称保健品\n    \"普通食品冒充保健\": [r\"保健品\", r\"保健食品\", r\"蓝帽\", r\"(日常|换季)保养\", r\"(替代|代替)药物\"],\n    # 保健食品广告必须带的声明\n    \"保健食品声明\": \"本品不能代替药物\",\n    # 保健食品的法定警示用语，本身含「治疗」等字，扫描前先剔除，避免误拦\n    \"法定用语\": [\"保健食品不是药物，不能代替药物治疗疾病\", \"本品不能代替药物\"],\n}\n\n\ndef main(product: str, platform: str, note: str) -> dict:\n    pid = (product or \"\").split(\" \")[0].strip()\n    if pid not in PRODUCTS:\n        return {\"status\": \"error\", \"message\": f\"未找到商品：{product}\", \"dossier\": \"\", \"product_name\": \"\",\n                \"qual_info\": \"\", \"product_json\": \"{}\", \"rules_json\": \"{}\"}\n    p = PRODUCTS[pid]\n\n    lines = [\n        f\"商品编号：{pid}\",\n        f\"商品名称：{p['名称']}\",\n        f\"品类：{p['品类']}\",\n        f\"资质类型：{p['资质类型']}\",\n        f\"批准文号：{p['批准文号']}\",\n        f\"批准功效：{('、'.join(p['批准功效'])) if p['批准功效'] else '无（不能宣称任何保健功效）'}\",\n        f\"价格：{p['价格']}\",\n        \"\",\n        \"【商品参数】\",\n    ]\n    for i, t in enumerate(p[\"参数\"], 1):\n        lines.append(f\"{pid}-参{i}：{t}\")\n    lines.append(\"\")\n    lines.append(\"【买家评价原话】\")\n    for i, t in enumerate(p[\"评价\"], 1):\n        lines.append(f\"{pid}-评{i}：{t}\")\n    lines.append(\"\")\n    lines.append(f\"【品牌调性】{BRAND['调性']}\")\n    lines.append(f\"【品牌目标人群】{BRAND['人群']}\")\n\n    source = {}\n    for i, t in enumerate(p[\"参数\"], 1):\n        source[f\"{pid}-参{i}\"] = t\n    for i, t in enumerate(p[\"评价\"], 1):\n        source[f\"{pid}-评{i}\"] = t\n\n    product_json = {\n        \"编号\": pid,\n        \"名称\": p[\"名称\"],\n        \"资质类型\": p[\"资质类型\"],\n        \"批准功效\": p[\"批准功效\"],\n        \"依据\": source,\n        \"平台\": platform,\n        \"运营补充要求\": note or \"\",\n    }\n    qual_info = \"\\n\".join(lines[2:6])\n    return {\n        \"status\": \"ok\",\n        \"message\": \"\",\n        \"dossier\": \"\\n\".join(lines),\n        \"product_name\": p[\"名称\"],\n        \"qual_info\": qual_info,\n        \"product_json\": json.dumps(product_json, ensure_ascii=False),\n        \"rules_json\": json.dumps(RULES, ensure_ascii=False),\n    }\n", "variables": [{"variable": "product", "value_selector": ["start", "product"], "value_type": "string"}, {"variable": "platform", "value_selector": ["start", "platform"], "value_type": "string"}, {"variable": "note", "value_selector": ["start", "note"], "value_type": "string"}], "outputs": {"status": {"type": "string", "children": null}, "message": {"type": "string", "children": null}, "dossier": {"type": "string", "children": null}, "product_name": {"type": "string", "children": null}, "qual_info": {"type": "string", "children": null}, "product_json": {"type": "string", "children": null}, "rules_json": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 400, "y": 380}, "positionAbsolute": {"x": 400, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "b_understand", "type": "custom", "data": {"type": "llm", "title": "B 商品理解Agent", "desc": "提炼卖点和人群，每条标依据编号", "model": {"provider": "langgenius/deepseek/deepseek", "name": "deepseek-v4-flash", "mode": "chat", "completion_params": {"temperature": 0.2}}, "prompt_template": [{"id": "sys-B 商品理解Agent", "role": "system", "text": "你是「元养」品牌内容团队的商品理解Agent。你的唯一任务：从商品资料里提炼卖点和目标人群，每一条都必须标出依据编号。\n\n## 规则\n1. 只能使用资料里给出的商品参数（编号形如 P01-参3）和买家评价原话（编号形如 P01-评5）。资料里没有的信息一律不写，不能补充常识、产地、工艺、排名。\n2. 每条卖点必须在「依据」里列出 1–3 个编号，编号必须原样照抄资料里的写法。没有依据的卖点不要输出。\n3. 卖点用买家听得懂的话写，每条 25 字以内，一条只讲一件事。优先提炼：成分含量、口味口感、食用方便、包装规格、真实使用场景。\n4. 功效边界：商品只能宣称「批准功效」里列出的功效。买家评价里提到的身体变化（例如感冒少了、皮肤变白、精神好了、便秘改善、心脏舒服），只是个人感受，不能提炼成卖点。批准功效为「无」的普通食品，不能提炼任何保健功效。\n5. 不写极限词（最、第一、顶级、100% 等），不和其他品牌比较。\n6. 目标人群提炼 2–3 个，同样要标依据。\n\n## 输出格式\n只输出一个 JSON 对象，不要输出任何解释、不要用代码块包裹：\n{\"卖点\":[{\"卖点\":\"……\",\"依据\":[\"P01-参1\"]}],\"人群\":[{\"人群\":\"……\",\"依据\":[\"P01-评3\"]}]}\n\n卖点输出 5–7 条。\n"}, {"id": "user-B 商品理解Agent", "role": "user", "text": "请为下面这个商品提炼卖点和目标人群。\n\n{{#a_data.dossier#}}\n"}], "context": {"enabled": false, "variable_selector": []}, "vision": {"enabled": false}, "variables": [], "reasoning_format": "separated", "selected": false}, "position": {"x": 720, "y": 280}, "positionAbsolute": {"x": 720, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "c_trace", "type": "custom", "data": {"type": "code", "title": "C 卖点溯源校验", "desc": "没有依据、超出批准功效的卖点直接拦掉", "code_language": "python3", "code": "# 节点C 卖点溯源校验（代码执行）\n# 作用：逐条检查「商品理解Agent」给出的卖点——\n#   1. 必须引用编号，且编号真实存在（没有依据就不写）；\n#   2. 卖点里不能出现超出「批准功效」的功效词（买家说\"感冒少了\"不等于商品能宣称增强免疫力）；\n#   3. 不能出现医疗用语。\n# 只有通过的卖点才交给「内容生成Agent」，从源头拦住编造功效。\nimport json\nimport re\n\n\ndef _parse(text):\n    t = (text or \"\").strip()\n    t = re.sub(r\"^```(json)?\", \"\", t).strip()\n    t = re.sub(r\"```$\", \"\", t).strip()\n    try:\n        return json.loads(t)\n    except Exception:\n        m = re.search(r\"\\{[\\s\\S]*\\}\", t)\n        if m:\n            try:\n                return json.loads(m.group(0))\n            except Exception:\n                return None\n    return None\n\n\ndef _effect_hits(text, rules, approved_cats):\n    hits = []\n    for cat, pats in rules[\"功效词\"].items():\n        if cat in approved_cats:\n            continue\n        for pat in pats:\n            m = re.search(pat, text)\n            if m:\n                hits.append((cat, m.group(0)))\n                break\n    return hits\n\n\ndef _medical_hits(text, rules):\n    out = []\n    for pat in rules[\"医疗用语\"]:\n        m = re.search(pat, text)\n        if m:\n            out.append(m.group(0))\n    return out\n\n\ndef main(agent_text: str, product_json: str, rules_json: str) -> dict:\n    prod = json.loads(product_json)\n    rules = json.loads(rules_json)\n    source = prod[\"依据\"]\n    approved_cats = [rules[\"批准功效映射\"].get(x, x) for x in prod[\"批准功效\"]]\n\n    agent_text = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", agent_text or \"\")\n    data = _parse(agent_text)\n    if not data or not isinstance(data.get(\"卖点\"), list):\n        return {\n            \"verified_points\": \"（商品理解Agent输出格式异常，未能解析卖点）\",\n            \"trace_table\": \"商品理解Agent输出格式异常，原文：\\n\" + (agent_text or \"\")[:800],\n            \"check_summary\": \"卖点解析失败\",\n        }\n\n    kept, dropped = [], []\n    for item in data[\"卖点\"]:\n        point = str(item.get(\"卖点\", \"\")).strip()\n        refs = item.get(\"依据\") or []\n        if isinstance(refs, str):\n            refs = re.findall(r\"P\\d{2}-[参评]\\d+\", refs)\n        refs = [r.strip() for r in refs if str(r).strip()]\n        if not point:\n            continue\n        reason = \"\"\n        if not refs:\n            reason = \"没有标依据\"\n        else:\n            bad = [r for r in refs if r not in source]\n            if bad:\n                reason = \"引用的编号不存在：\" + \"、\".join(bad)\n        if not reason:\n            eh = _effect_hits(point, rules, approved_cats)\n            if eh:\n                reason = \"超出批准功效：\" + \"、\".join(f\"「{w}」属于{c}\" for c, w in eh)\n        if not reason:\n            mh = _medical_hits(point, rules)\n            if mh:\n                reason = \"医疗用语：\" + \"、\".join(mh)\n        if reason:\n            dropped.append((point, refs, reason))\n        else:\n            kept.append((point, refs))\n\n    crowd = data.get(\"人群\") or []\n    crowd_lines = []\n    for c in crowd:\n        if isinstance(c, dict):\n            crowd_lines.append(f\"- {c.get('人群', '')}（依据：{'、'.join(c.get('依据') or [])}）\")\n        else:\n            crowd_lines.append(f\"- {c}\")\n\n    vp = []\n    for i, (pt, refs) in enumerate(kept, 1):\n        vp.append(f\"卖点{i}：{pt}（依据：{'、'.join(refs)}）\")\n    verified_points = \"\\n\".join(vp) if vp else \"（没有通过校验的卖点）\"\n    if crowd_lines:\n        verified_points += \"\\n\\n目标人群：\\n\" + \"\\n\".join(crowd_lines)\n\n    tbl = [\"| 卖点 | 依据编号 | 依据原文 | 结果 |\", \"|---|---|---|---|\"]\n    for pt, refs in kept:\n        src = \"；\".join(source.get(r, \"\") for r in refs)\n        tbl.append(f\"| {pt} | {'、'.join(refs)} | {src} | ✅ 采用 |\")\n    for pt, refs, reason in dropped:\n        src = \"；\".join(source.get(r, \"（不存在）\") for r in refs) if refs else \"—\"\n        tbl.append(f\"| {pt} | {'、'.join(refs) or '—'} | {src} | ❌ 拦截：{reason} |\")\n\n    summary = f\"商品理解Agent共提炼 {len(kept) + len(dropped)} 条卖点，采用 {len(kept)} 条，拦截 {len(dropped)} 条\"\n    return {\"verified_points\": verified_points, \"trace_table\": \"\\n\".join(tbl), \"check_summary\": summary}\n", "variables": [{"variable": "agent_text", "value_selector": ["b_understand", "text"], "value_type": "string"}, {"variable": "product_json", "value_selector": ["a_data", "product_json"], "value_type": "string"}, {"variable": "rules_json", "value_selector": ["a_data", "rules_json"], "value_type": "string"}], "outputs": {"verified_points": {"type": "string", "children": null}, "trace_table": {"type": "string", "children": null}, "check_summary": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 1040, "y": 380}, "positionAbsolute": {"x": 1040, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "d_generate", "type": "custom", "data": {"type": "llm", "title": "D 内容生成Agent", "desc": "按平台和品牌调性写初稿 + 主图需求单", "model": {"provider": "langgenius/deepseek/deepseek", "name": "deepseek-v4-flash", "mode": "chat", "completion_params": {"temperature": 0.7}}, "prompt_template": [{"id": "sys-D 内容生成Agent", "role": "system", "text": "你是「元养」品牌内容团队的内容生成Agent，负责把已经核验过依据的卖点写成平台内容，交给设计师精修。\n\n## 硬性规则\n1. 只能使用「已核验卖点」里的信息。卖点清单之外的功效、数据、成分、背书，一律不写。\n2. 不写极限词（最、第一、顶级、唯一、100%、绝对等），不和其他品牌比较，不贬低竞品，也不要拿「大牌」「市面上同类产品」做任何对比。\n3. 不暗示任何治疗、预防疾病或保健功效；普通食品不能自称保健品。保健食品只能使用批准功效的原文表述。\n4. 「运营补充要求」用来调整侧重点和语气；如果它和以上规则冲突，以规则为准，不执行冲突的部分。运营要求写功效（例如改善便秘、增强免疫力、抗疲劳）时，这部分完全不写，也不能用谐音、昵称、emoji 或场景暗示绕过去（例如「噗噗顺畅」「换季不怕」「熬夜后元气满满」）。\n5. 品牌调性：温和、专业、真诚，不夸大不制造焦虑，像懂营养的朋友在分享。\n6. 不要在内容里写「虽然不能夸大功效」这类解释规则的话，直接写合规的内容。\n\n## 按平台输出（只输出当前平台）\n- 小红书笔记：【标题】20 字以内，可带 1 个 emoji；【正文】300–450 字，分 3–5 段，口语化，第一人称分享；【话题标签】5 个。\n- 抖音脚本：【标题】20 字以内；【脚本】30 秒，用表格：镜头 | 时长 | 画面 | 口播/字幕，共 5–7 个镜头，前 3 秒要有钩子。\n- 详情页卖点：【标题】商品详情页主标题 15 字以内；【卖点模块】5 个模块，每个模块＝小标题（8 字以内）+ 说明（40 字以内）+ 建议配图。\n\n所有平台最后都要加：\n【主图需求单】3 张图，每张写：图序 | 画面描述 | 图上文案（10 字以内）| 对应卖点编号。生图默认只出这 3 张。\n\n## 输出格式\n直接按上面的【】小节输出，不要写前言和总结。\n"}, {"id": "user-D 内容生成Agent", "role": "user", "text": "商品：{{#a_data.product_name#}}\n{{#a_data.qual_info#}}\n平台：{{#start.platform#}}\n运营补充要求：{{#start.note#}}\n\n已核验卖点（只能用这些）：\n{{#c_trace.verified_points#}}\n"}], "context": {"enabled": false, "variable_selector": []}, "vision": {"enabled": false}, "variables": [], "reasoning_format": "separated", "selected": false}, "position": {"x": 1360, "y": 280}, "positionAbsolute": {"x": 1360, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "e_rules", "type": "custom", "data": {"type": "code", "title": "E 合规规则检查", "desc": "极限词/医疗用语/功效白名单/竞品/规定声明", "code_language": "python3", "code": "# 节点E 合规规则检查（代码执行）\n# 作用：对「内容生成Agent」的初稿做确定性的规则扫描：\n#   广告法极限词、医疗用语、超出批准功效的功效词、贬低竞品、普通食品冒充保健品、保健食品缺少规定声明。\n# 规则能判的交给规则（稳定、可解释、零成本）；规则判不了的暗示和夸大，再交给「合规审核Agent」。\nimport json\nimport re\n\n\ndef scan(text, prod, rules):\n    hits = []\n    decl = rules[\"保健食品声明\"]\n    body = (text or \"\").replace(decl, \"\")\n    if prod[\"资质类型\"] == \"保健食品\":\n        for ph in rules.get(\"法定用语\", []):\n            body = body.replace(ph, \"\")\n    approved_cats = [rules[\"批准功效映射\"].get(x, x) for x in prod[\"批准功效\"]]\n\n    spans = []\n\n    def add(kind, word, pos):\n        end = pos + len(word)\n        for a, b in spans:\n            if pos < b and end > a:\n                return\n        spans.append((pos, end))\n        s = max(0, pos - 12)\n        e = min(len(body), pos + len(word) + 12)\n        ctx = body[s:e].replace(\"\\n\", \" \")\n        hits.append({\"类型\": kind, \"命中\": word, \"上下文\": ctx})\n\n    for pat in rules[\"极限词\"]:\n        for m in re.finditer(pat, body):\n            add(\"广告法极限词\", m.group(0), m.start())\n    for pat in rules[\"医疗用语\"]:\n        for m in re.finditer(pat, body):\n            add(\"医疗用语\", m.group(0), m.start())\n    for cat, pats in rules[\"功效词\"].items():\n        if cat in approved_cats:\n            continue\n        for pat in pats:\n            for m in re.finditer(pat, body):\n                add(f\"超出批准功效（{cat}）\", m.group(0), m.start())\n    for pat in rules[\"竞品对比\"]:\n        for m in re.finditer(pat, body):\n            add(\"贬低竞品\", m.group(0), m.start())\n    if prod[\"资质类型\"] != \"保健食品\":\n        for pat in rules[\"普通食品冒充保健\"]:\n            for m in re.finditer(pat, body):\n                add(\"普通食品不得称保健品\", m.group(0), m.start())\n    missing_decl = prod[\"资质类型\"] == \"保健食品\" and decl not in (text or \"\")\n    return hits, missing_decl\n\n\ndef fmt(hits, missing_decl, decl):\n    lines = []\n    for i, h in enumerate(hits, 1):\n        lines.append(f\"{i}. [{h['类型']}] 「{h['命中']}」… {h['上下文']} …\")\n    if missing_decl:\n        lines.append(f\"{len(hits) + 1}. [缺少规定声明] 保健食品内容必须包含「{decl}」\")\n    return \"\\n\".join(lines) if lines else \"无命中\"\n\n\ndef main(draft: str, product_json: str, rules_json: str) -> dict:\n    prod = json.loads(product_json)\n    rules = json.loads(rules_json)\n    draft = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", draft or \"\")\n    hits, missing = scan(draft, prod, rules)\n    n = len(hits) + (1 if missing else 0)\n    return {\"rule_hits\": fmt(hits, missing, rules[\"保健食品声明\"]), \"hit_count\": str(n)}\n", "variables": [{"variable": "draft", "value_selector": ["d_generate", "text"], "value_type": "string"}, {"variable": "product_json", "value_selector": ["a_data", "product_json"], "value_type": "string"}, {"variable": "rules_json", "value_selector": ["a_data", "rules_json"], "value_type": "string"}], "outputs": {"rule_hits": {"type": "string", "children": null}, "hit_count": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 1680, "y": 380}, "positionAbsolute": {"x": 1680, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "f_review", "type": "custom", "data": {"type": "llm", "title": "F 合规审核Agent", "desc": "改掉规则命中 + 语义审核暗示和夸大", "model": {"provider": "langgenius/deepseek/deepseek", "name": "deepseek-v4-flash", "mode": "chat", "completion_params": {"temperature": 0.2}}, "prompt_template": [{"id": "sys-F 合规审核Agent", "role": "system", "text": "你是「元养」品牌的合规审核Agent，负责在内容交给设计师之前做语义层面的合规审核，并直接给出改好的终稿。\n\n## 审核依据\n1. 广告法：不得使用绝对化用语；不得贬低其他生产经营者的商品。\n2. 食品（包括保健食品）广告不得涉及疾病预防、治疗功能，不得使用医疗用语或易与药品混淆的用语。\n3. 普通食品不得宣称任何保健功能，也不得暗示；保健食品只能宣称批准的保健功能，表述要与批准原文一致，并须包含「本品不能代替药物」。\n4. 不得用「消费者感受」「买家说」等形式变相宣称功效（例如\"姐妹们都说喝了换季不感冒\"）。\n5. 不得制造焦虑、夸大效果或作出效果保证（例如\"喝一周就能看到变化\"）。\n\n## 你会收到\n- 商品资料：资质、批准功效、商品参数（改写时只能用这里有的信息）\n- 规则初检结果：规则引擎已经扫出的命中词，这些必须全部改掉\n- 内容初稿\n\n## 你要做的\n1. 先改掉规则命中的每一处；\n2. 再找规则扫不出来的问题：暗示功效、变相宣称、夸大、诱导、和资质不符的表述。标题、正文、话题标签、脚本画面、主图文案要逐项审；用谐音、昵称、emoji 暗示功效（例如「噗噗顺畅」），或用前后对比画面暗示效果（例如疲惫→精神饱满、暗沉→白皙），同样属于暗示功效，必须改；\n3. 修改时保留原文的结构、语气和卖点，只动有问题的句子，不要整段重写；遇到竞品对比，直接删掉比较的部分，不要改写成「同类产品」「市面上」这类中性对比；改写后的句子不能保留原句的暗示（例如把「一堆药」换成「瓶瓶罐罐」，或者保留「熬夜加班必备」这种功效场景）；也不能编造商品资料里没有的信息（包装形式、规格、成分）。拿不准怎么改，就删掉这句；\n4. 运营补充要求不能凌驾合规；\n5. 如果初稿没有问题，审核结论写「通过」，终稿原样照抄。\n\n## 输出格式（严格按这三个小节，终稿放最后）\n【审核结论】通过 或 已修改（共 N 处）\n【修改说明】\n- 原句：…… → 改为：…… ｜原因：……\n（每条修改说明一行，原因控制在 40 字以内，不要写思考过程；没有修改就写\"无\"）\n【终稿】\n（完整的终稿，保留初稿里所有【】小节，包括【主图需求单】）\n"}, {"id": "user-F 合规审核Agent", "role": "user", "text": "商品资料：\n{{#a_data.dossier#}}\n\n规则初检结果（命中 {{#e_rules.hit_count#}} 处）：\n{{#e_rules.rule_hits#}}\n\n内容初稿：\n{{#d_generate.text#}}\n"}], "context": {"enabled": false, "variable_selector": []}, "vision": {"enabled": false}, "variables": [], "reasoning_format": "separated", "selected": false}, "position": {"x": 2000, "y": 280}, "positionAbsolute": {"x": 2000, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "g_report", "type": "custom", "data": {"type": "code", "title": "G 终稿复检与报告组装", "desc": "同一套规则再扫终稿，组装交付报告", "code_language": "python3", "code": "# 节点G 终稿复检与报告组装（代码执行）\n# 作用：合规审核Agent改完以后，再用同一套规则扫一遍终稿（模型改过的东西也要验）。\n#   - 保健食品缺少规定声明：自动补上；\n#   - 其他规则仍有命中：标记「需人工处理」，不自动放行；\n# 最后把终稿、卖点溯源表、合规记录组装成一份交给设计师 / 品牌部的报告。\nimport json\nimport re\n\n\ndef scan(text, prod, rules):\n    hits = []\n    decl = rules[\"保健食品声明\"]\n    body = (text or \"\").replace(decl, \"\")\n    if prod[\"资质类型\"] == \"保健食品\":\n        for ph in rules.get(\"法定用语\", []):\n            body = body.replace(ph, \"\")\n    approved_cats = [rules[\"批准功效映射\"].get(x, x) for x in prod[\"批准功效\"]]\n\n    spans = []\n\n    def add(kind, word, pos):\n        end = pos + len(word)\n        for a, b in spans:\n            if pos < b and end > a:\n                return\n        spans.append((pos, end))\n        s = max(0, pos - 12)\n        e = min(len(body), pos + len(word) + 12)\n        hits.append({\"类型\": kind, \"命中\": word, \"上下文\": body[s:e].replace(\"\\n\", \" \")})\n\n    for pat in rules[\"极限词\"]:\n        for m in re.finditer(pat, body):\n            add(\"广告法极限词\", m.group(0), m.start())\n    for pat in rules[\"医疗用语\"]:\n        for m in re.finditer(pat, body):\n            add(\"医疗用语\", m.group(0), m.start())\n    for cat, pats in rules[\"功效词\"].items():\n        if cat in approved_cats:\n            continue\n        for pat in pats:\n            for m in re.finditer(pat, body):\n                add(f\"超出批准功效（{cat}）\", m.group(0), m.start())\n    for pat in rules[\"竞品对比\"]:\n        for m in re.finditer(pat, body):\n            add(\"贬低竞品\", m.group(0), m.start())\n    if prod[\"资质类型\"] != \"保健食品\":\n        for pat in rules[\"普通食品冒充保健\"]:\n            for m in re.finditer(pat, body):\n                add(\"普通食品不得称保健品\", m.group(0), m.start())\n    missing_decl = prod[\"资质类型\"] == \"保健食品\" and decl not in (text or \"\")\n    return hits, missing_decl\n\n\ndef _section(text, name):\n    m = re.search(r\"【\" + name + r\"】\\s*([\\s\\S]*?)(?=\\n【[^】]+】|\\Z)\", text or \"\")\n    return m.group(1).strip() if m else \"\"\n\n\ndef main(review_text: str, draft: str, product_json: str, rules_json: str,\n         trace_table: str, check_summary: str, rule_hits: str, hit_count: str) -> dict:\n    prod = json.loads(product_json)\n    rules = json.loads(rules_json)\n    decl = rules[\"保健食品声明\"]\n\n    review_text = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", review_text or \"\")\n    draft = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", draft or \"\")\n    final = review_text.split(\"【终稿】\", 1)[1].strip() if \"【终稿】\" in (review_text or \"\") else \"\"\n    used_fallback = False\n    if not final:\n        final = draft or \"\"\n        used_fallback = True\n    verdict = _section(review_text, \"审核结论\") or \"（未给出）\"\n    changes = _section(review_text, \"修改说明\") or \"无\"\n\n    hits, missing = scan(final, prod, rules)\n    auto_fix = \"\"\n    if missing:\n        final = final.rstrip() + f\"\\n\\n（{decl}）\"\n        auto_fix = f\"终稿缺少保健食品规定声明，已自动补上「{decl}」\"\n\n    if hits:\n        status = f\"⚠️ 需人工处理：终稿复检仍有 {len(hits)} 处命中\"\n        recheck = \"\\n\".join(f\"- [{h['类型']}] 「{h['命中']}」… {h['上下文']} …\" for h in hits)\n    else:\n        status = \"✅ 可交付设计师精修\"\n        recheck = \"无命中\"\n    if used_fallback:\n        status = \"⚠️ 需人工处理：合规审核Agent未按格式返回终稿，以下为未审核初稿\"\n\n    report = f\"\"\"# 内容Agent 输出｜{prod['名称']}｜{prod['平台']}\n\n**状态：{status}**\n\n资质：{prod['资质类型']}｜批准功效：{('、'.join(prod['批准功效'])) or '无'}\n运营补充要求：{prod['运营补充要求'] or '无'}\n\n---\n\n## 一、终稿\n\n{final}\n\n---\n\n## 二、卖点溯源表\n\n{check_summary}\n\n{trace_table}\n\n---\n\n## 三、合规审核记录\n\n**① 规则初检（初稿）：命中 {hit_count} 处**\n\n{rule_hits}\n\n**② 合规审核Agent：{verdict}**\n\n{changes}\n\n**③ 终稿规则复检：** {recheck}\n{('**自动修正：** ' + auto_fix) if auto_fix else ''}\n\n---\n流程：商品理解Agent → 卖点溯源校验（代码）→ 内容生成Agent → 合规规则检查（代码）→ 合规审核Agent → 终稿复检（代码）→ 设计师精修 → 品牌部审核\n\"\"\"\n    return {\"report\": report, \"status\": status}\n", "variables": [{"variable": "review_text", "value_selector": ["f_review", "text"], "value_type": "string"}, {"variable": "draft", "value_selector": ["d_generate", "text"], "value_type": "string"}, {"variable": "product_json", "value_selector": ["a_data", "product_json"], "value_type": "string"}, {"variable": "rules_json", "value_selector": ["a_data", "rules_json"], "value_type": "string"}, {"variable": "trace_table", "value_selector": ["c_trace", "trace_table"], "value_type": "string"}, {"variable": "check_summary", "value_selector": ["c_trace", "check_summary"], "value_type": "string"}, {"variable": "rule_hits", "value_selector": ["e_rules", "rule_hits"], "value_type": "string"}, {"variable": "hit_count", "value_selector": ["e_rules", "hit_count"], "value_type": "string"}], "outputs": {"report": {"type": "string", "children": null}, "status": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 2320, "y": 380}, "positionAbsolute": {"x": 2320, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "end", "type": "custom", "data": {"type": "end", "title": "结束", "desc": "", "outputs": [{"variable": "report", "value_selector": ["g_report", "report"], "value_type": "string"}], "selected": false}, "position": {"x": 2640, "y": 280}, "positionAbsolute": {"x": 2640, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}], "edges": [{"id": "start-source-a_data-target", "source": "start", "sourceHandle": "source", "target": "a_data", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "start", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "a_data-source-b_understand-target", "source": "a_data", "sourceHandle": "source", "target": "b_understand", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "llm", "isInIteration": false, "isInLoop": false}}, {"id": "b_understand-source-c_trace-target", "source": "b_understand", "sourceHandle": "source", "target": "c_trace", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "llm", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "c_trace-source-d_generate-target", "source": "c_trace", "sourceHandle": "source", "target": "d_generate", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "llm", "isInIteration": false, "isInLoop": false}}, {"id": "d_generate-source-e_rules-target", "source": "d_generate", "sourceHandle": "source", "target": "e_rules", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "llm", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "e_rules-source-f_review-target", "source": "e_rules", "sourceHandle": "source", "target": "f_review", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "llm", "isInIteration": false, "isInLoop": false}}, {"id": "f_review-source-g_report-target", "source": "f_review", "sourceHandle": "source", "target": "g_report", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "llm", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "g_report-source-end-target", "source": "g_report", "sourceHandle": "source", "target": "end", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "end", "isInIteration": false, "isInLoop": false}}], "viewport": {"x": 0, "y": 0, "zoom": 0.7}}}}