{"app": {"name": "合规关卡-评测", "mode": "workflow", "icon": "🧪", "icon_background": "#E0F2FE", "description": "把内容Agent的合规关卡（规则初检 → 合规审核Agent → 终稿复检）单独拎出来，用违规样本集测拦截率和误拦率。", "use_icon_as_answer_icon": false}, "kind": "app", "version": "0.3.0", "dependencies": [], "workflow": {"conversation_variables": [], "environment_variables": [], "features": {"file_upload": {"enabled": false}, "opening_statement": "", "retriever_resource": {"enabled": false}, "sensitive_word_avoidance": {"enabled": false}, "speech_to_text": {"enabled": false}, "suggested_questions": [], "suggested_questions_after_answer": {"enabled": false}, "text_to_speech": {"enabled": false}}, "graph": {"nodes": [{"id": "start", "type": "custom", "data": {"type": "start", "title": "开始", "desc": "", "variables": [{"variable": "product", "label": "商品", "type": "select", "options": ["P01 维生素C咀嚼片（保健食品）", "P02 乳清蛋白粉（普通食品）", "P03 辅酶Q10软胶囊（保健食品）", "P04 益生菌固体饮料（普通食品）", "P05 胶原蛋白肽饮（普通食品）"], "required": true, "max_length": 48}, {"variable": "text", "label": "待审文案", "type": "paragraph", "required": true, "max_length": 2000}], "selected": false}, "position": {"x": 80, "y": 280}, "positionAbsolute": {"x": 80, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "a_data", "type": "custom", "data": {"type": "code", "title": "A 商品资料与规则库", "desc": "和主流程同一份代码（平台、运营要求在这里用不到）", "code_language": "python3", "code": "# 节点A 商品资料与规则库（代码执行）\n# 作用：按选中的商品取出「参数 + 买家评价 + 资质」，每条都带编号，后面的卖点必须引用这些编号。\n#       同时输出合规规则库，给后面的「卖点溯源校验」「合规规则检查」「终稿复检」共用。\n# 所有品牌、商品、批准文号、评价都是虚构的演示数据。\nimport json\n\nBRAND = {\n    \"品牌\": \"元养\",\n    \"调性\": \"温和、专业、真诚，不夸大不制造焦虑；像懂营养的朋友在分享，而不是推销员在喊话\",\n    \"人群\": \"25-40 岁一二线城市上班族，关注日常营养，讨厌被忽悠\",\n}\n\nPRODUCTS = {\n    \"P01\": {\n        \"名称\": \"元养 维生素C咀嚼片（香橙味）\",\n        \"品类\": \"营养素补充剂\",\n        \"资质类型\": \"保健食品\",\n        \"批准文号\": \"国食健注G20990001（虚构）\",\n        \"批准功效\": [\"补充维生素C\"],\n        \"价格\": \"59元/瓶（60片）\",\n        \"参数\": [\n            \"每片含维生素C 100mg\",\n            \"规格：1.2g×60片，每日1片，嚼服\",\n            \"香橙味，甜味来自木糖醇，不添加蔗糖\",\n            \"适宜人群：需要补充维生素C的成人\",\n            \"不适宜人群：少年儿童、孕妇、乳母\",\n            \"瓶身小巧，高约8cm，可放进通勤包\",\n        ],\n        \"评价\": [\n            \"很好嚼，不粘牙，像小时候吃的橙子糖\",\n            \"酸甜口，不会齁，办公室同事都问我要\",\n            \"瓶子小，放包里每天想起来就吃一片\",\n            \"吃了一个多月，感觉感冒都少了，抵抗力变好了\",\n            \"皮肤好像也变白了一点，不知道是不是心理作用\",\n            \"比药店买的便宜，60片能吃两个月\",\n            \"无糖这点很加分，控糖期也敢吃\",\n            \"物流很快，第二天就到了\",\n        ],\n    },\n    \"P02\": {\n        \"名称\": \"元养 乳清蛋白粉（香草味，固体饮料）\",\n        \"品类\": \"固体饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"199元/罐（900g，约30份）\",\n        \"参数\": [\n            \"每份30g含蛋白质24g\",\n            \"蛋白来源：进口浓缩乳清蛋白\",\n            \"不添加蔗糖，香草味\",\n            \"冷水、温水都能冲，摇杯摇10秒即可溶开\",\n            \"规格：900g/罐，内附量勺\",\n            \"食用建议：运动后或早餐时冲饮1份\",\n        ],\n        \"评价\": [\n            \"冷水一摇就开，没有结块，这点比之前买的强\",\n            \"香草味很淡，不腻，加进燕麦里也好喝\",\n            \"健身完喝一杯，很方便\",\n            \"早餐来不及吃，冲一杯能顶到中午\",\n            \"喝了一个月，换季居然没感冒，感觉抵抗力好了\",\n            \"比某大牌便宜一半，品质差不多\",\n            \"罐子密封好，勺子放在盖子卡槽里不会埋在粉里\",\n            \"蛋白含量写得很清楚，24克一份算高的\",\n        ],\n    },\n    \"P03\": {\n        \"名称\": \"元养 辅酶Q10软胶囊\",\n        \"品类\": \"保健食品（功能声称类）\",\n        \"资质类型\": \"保健食品\",\n        \"批准文号\": \"国食健注G20990003（虚构）\",\n        \"批准功效\": [\"有助于抗氧化\"],\n        \"价格\": \"168元/瓶（60粒）\",\n        \"参数\": [\n            \"每粒含辅酶Q10 50mg\",\n            \"规格：0.5g×60粒，每日1粒，随餐吞服\",\n            \"软胶囊，粒径小，易吞咽\",\n            \"保健功能：有助于抗氧化\",\n            \"不适宜人群：少年儿童、孕妇、乳母\",\n            \"瓶盖有防伪码，可扫码查验\",\n        ],\n        \"评价\": [\n            \"胶囊很小，一口就吞下去了\",\n            \"没有怪味，打嗝也没有味道\",\n            \"最近经常熬夜加班，吃了感觉精神好一些，没那么累了\",\n            \"我爸心脏不太好，吃了之后说胸口舒服多了\",\n            \"扫了防伪码，能查到批次，放心\",\n            \"一天一粒，记得住，不麻烦\",\n            \"包装简洁，送长辈也拿得出手\",\n            \"客服回复很专业，问了适不适合我妈吃\",\n        ],\n    },\n    \"P04\": {\n        \"名称\": \"元养 益生菌固体饮料（酸奶味）\",\n        \"品类\": \"固体饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"89元/盒（2g×20条）\",\n        \"参数\": [\n            \"每条2g，出厂时益生菌活菌数≥100亿CFU\",\n            \"菌株：乳双歧杆菌、嗜酸乳杆菌\",\n            \"添加低聚果糖\",\n            \"酸奶味，可直接吃，也可用40℃以下温水冲\",\n            \"独立条装：2g×20条\",\n            \"常温储存，避免阳光直射\",\n        ],\n        \"评价\": [\n            \"酸奶味的，直接倒嘴里吃也好吃\",\n            \"小条装出差带着很方便\",\n            \"坚持喝了两周，便秘好多了，每天都很顺\",\n            \"生产日期很新鲜，是上个月的\",\n            \"温水冲开没有沉淀\",\n            \"家里人都爱吃这个口味\",\n            \"活菌数写在包装上，比较透明\",\n            \"一盒20条，一天一条刚好吃大半个月\",\n        ],\n    },\n    \"P05\": {\n        \"名称\": \"元养 胶原蛋白肽饮（樱桃味）\",\n        \"品类\": \"饮料\",\n        \"资质类型\": \"普通食品\",\n        \"批准文号\": \"无（普通食品，无保健功能批文）\",\n        \"批准功效\": [],\n        \"价格\": \"129元/盒（50ml×10瓶）\",\n        \"参数\": [\n            \"每瓶50ml含胶原蛋白肽5000mg\",\n            \"添加维生素C\",\n            \"0脂肪，樱桃味\",\n            \"规格：50ml×10瓶\",\n            \"冷藏后口感更好，开封后请尽快饮用\",\n            \"小瓶玻璃装，礼盒包装\",\n        ],\n        \"评价\": [\n            \"樱桃味很好喝，一点都不腥\",\n            \"小瓶一口喝完，上班带一瓶刚好\",\n            \"喝了半个月，皮肤白了，眼角细纹也少了\",\n            \"礼盒很好看，送闺蜜很有面子\",\n            \"冰过之后更好喝，像果汁\",\n            \"5000mg的含量在同价位里算高的\",\n            \"玻璃瓶有点重，但是质感好\",\n            \"配料表挺干净的\",\n        ],\n    },\n}\n\n# ---------------- 合规规则库（真实业务里由法务维护，这里是演示版） ----------------\nRULES = {\n    \"说明\": \"规则能判的交给规则；模型只处理语义审核（暗示、夸大、诱导）。\",\n    # 广告法：绝对化用语\n    \"极限词\": [\n        r\"最(好|佳|强|优|棒|高|低|大|新|先进|安全|有效|便宜|划算|值)\",\n        r\"第一(?!次|步|口|天|周|个|瓶|片|条|粒|杯)\",\n        r\"顶级\", r\"极致\", r\"国家级\", r\"世界级\", r\"首选\", r\"唯一\", r\"独家\",\n        r\"100%\", r\"百分百\", r\"绝对\", r\"万能\", r\"史无前例\", r\"销量冠军\", r\"NO\\.?1\", r\"No\\.?1\", r\"王牌\", r\"无敌\",\n    ],\n    # 食品（含保健食品）一律不得涉及疾病预防、治疗\n    \"医疗用语\": [\n        r\"治疗\", r\"治愈\", r\"疗效\", r\"根治\", r\"药到病除\", r\"抗癌\", r\"防癌\", r\"降血压\", r\"降血糖\", r\"降血脂\", r\"降三高\",\n        r\"消炎\", r\"特效\", r\"药效\", r\"医治\", r\"病症\", r\"心脏(不好|病)\", r\"护心\", r\"保护心脏\", r\"心血管\",\n        r\"无副作用\", r\"零风险\", r\"安全无毒\",\n    ],\n    # 功效词 → 功效类别；商品「批准功效」里没有这个类别，就不能出现这些词\n    \"功效词\": {\n        \"增强免疫力\": [r\"免疫力\", r\"抵抗力\", r\"增强免疫\", r\"提高免疫\", r\"少感冒\", r\"不感冒\", r\"没感冒\", r\"不生病\", r\"防感冒\", r\"换季不怕\"],\n        \"调节肠道菌群/润肠通便\": [r\"肠道菌群\", r\"调节肠道\", r\"改善肠道\", r\"便秘\", r\"通便\", r\"润肠\", r\"排毒\", r\"清肠\", r\"宿便\", r\"排便\", r\"调理肠道\", r\"肠道健康\", r\"(?<!吞咽)(通畅|顺畅)\", r\"噗噗\", r\"嗯嗯\"],\n        \"抗氧化\": [r\"抗氧化\", r\"自由基\"],\n        \"缓解体力疲劳\": [r\"抗疲劳\", r\"缓解疲劳\", r\"消除疲劳\", r\"精力充沛\", r\"没那么累\", r\"不累\"],\n        \"美容类\": [r\"美白\", r\"变白\", r\"(?<![明说])白了\", r\"淡斑\", r\"祛斑\", r\"抗衰\", r\"抗老\", r\"抗皱\", r\"祛皱\", r\"细纹\", r\"紧致\", r\"逆龄\", r\"冻龄\", r\"嫩肤\"],\n        \"减肥类\": [r\"减肥\", r\"瘦身\", r\"燃脂\", r\"刮油\", r\"掉秤\"],\n        \"改善睡眠\": [r\"助眠\", r\"改善睡眠\", r\"失眠\", r\"睡得更好\"],\n        \"补充维生素C\": [r\"补充维生素C\", r\"补充VC\", r\"补VC\"],\n    },\n    # 批准功效原文 → 功效类别\n    \"批准功效映射\": {\"补充维生素C\": \"补充维生素C\", \"有助于抗氧化\": \"抗氧化\"},\n    # 贬低竞品\n    \"竞品对比\": [r\"(比|吊打|秒杀|碾压|完胜)(某|别家|其他家|大牌|同类|竞品)\", r\"大牌\", r\"(市面上|同类产品|其他品牌|别家).{0,15}(更|不如|没有|比不上)\", r\"智商税\"],\n    # 普通食品不能自称保健品\n    \"普通食品冒充保健\": [r\"保健品\", r\"保健食品\", r\"蓝帽\", r\"(日常|换季)保养\", r\"(替代|代替)药物\"],\n    # 保健食品广告必须带的声明\n    \"保健食品声明\": \"本品不能代替药物\",\n    # 保健食品的法定警示用语，本身含「治疗」等字，扫描前先剔除，避免误拦\n    \"法定用语\": [\"保健食品不是药物，不能代替药物治疗疾病\", \"本品不能代替药物\"],\n}\n\n\ndef main(product: str, platform: str, note: str) -> dict:\n    pid = (product or \"\").split(\" \")[0].strip()\n    if pid not in PRODUCTS:\n        return {\"status\": \"error\", \"message\": f\"未找到商品：{product}\", \"dossier\": \"\", \"product_name\": \"\",\n                \"qual_info\": \"\", \"product_json\": \"{}\", \"rules_json\": \"{}\"}\n    p = PRODUCTS[pid]\n\n    lines = [\n        f\"商品编号：{pid}\",\n        f\"商品名称：{p['名称']}\",\n        f\"品类：{p['品类']}\",\n        f\"资质类型：{p['资质类型']}\",\n        f\"批准文号：{p['批准文号']}\",\n        f\"批准功效：{('、'.join(p['批准功效'])) if p['批准功效'] else '无（不能宣称任何保健功效）'}\",\n        f\"价格：{p['价格']}\",\n        \"\",\n        \"【商品参数】\",\n    ]\n    for i, t in enumerate(p[\"参数\"], 1):\n        lines.append(f\"{pid}-参{i}：{t}\")\n    lines.append(\"\")\n    lines.append(\"【买家评价原话】\")\n    for i, t in enumerate(p[\"评价\"], 1):\n        lines.append(f\"{pid}-评{i}：{t}\")\n    lines.append(\"\")\n    lines.append(f\"【品牌调性】{BRAND['调性']}\")\n    lines.append(f\"【品牌目标人群】{BRAND['人群']}\")\n\n    source = {}\n    for i, t in enumerate(p[\"参数\"], 1):\n        source[f\"{pid}-参{i}\"] = t\n    for i, t in enumerate(p[\"评价\"], 1):\n        source[f\"{pid}-评{i}\"] = t\n\n    product_json = {\n        \"编号\": pid,\n        \"名称\": p[\"名称\"],\n        \"资质类型\": p[\"资质类型\"],\n        \"批准功效\": p[\"批准功效\"],\n        \"依据\": source,\n        \"平台\": platform,\n        \"运营补充要求\": note or \"\",\n    }\n    qual_info = \"\\n\".join(lines[2:6])\n    return {\n        \"status\": \"ok\",\n        \"message\": \"\",\n        \"dossier\": \"\\n\".join(lines),\n        \"product_name\": p[\"名称\"],\n        \"qual_info\": qual_info,\n        \"product_json\": json.dumps(product_json, ensure_ascii=False),\n        \"rules_json\": json.dumps(RULES, ensure_ascii=False),\n    }\n", "variables": [{"variable": "product", "value_selector": ["start", "product"], "value_type": "string"}, {"variable": "platform", "value_selector": ["start", "product"], "value_type": "string"}, {"variable": "note", "value_selector": ["start", "product"], "value_type": "string"}], "outputs": {"status": {"type": "string", "children": null}, "message": {"type": "string", "children": null}, "dossier": {"type": "string", "children": null}, "product_name": {"type": "string", "children": null}, "qual_info": {"type": "string", "children": null}, "product_json": {"type": "string", "children": null}, "rules_json": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 400, "y": 380}, "positionAbsolute": {"x": 400, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "e_rules", "type": "custom", "data": {"type": "code", "title": "E 合规规则检查", "desc": "和主流程同一份代码", "code_language": "python3", "code": "# 节点E 合规规则检查（代码执行）\n# 作用：对「内容生成Agent」的初稿做确定性的规则扫描：\n#   广告法极限词、医疗用语、超出批准功效的功效词、贬低竞品、普通食品冒充保健品、保健食品缺少规定声明。\n# 规则能判的交给规则（稳定、可解释、零成本）；规则判不了的暗示和夸大，再交给「合规审核Agent」。\nimport json\nimport re\n\n\ndef scan(text, prod, rules):\n    hits = []\n    decl = rules[\"保健食品声明\"]\n    body = (text or \"\").replace(decl, \"\")\n    if prod[\"资质类型\"] == \"保健食品\":\n        for ph in rules.get(\"法定用语\", []):\n            body = body.replace(ph, \"\")\n    approved_cats = [rules[\"批准功效映射\"].get(x, x) for x in prod[\"批准功效\"]]\n\n    spans = []\n\n    def add(kind, word, pos):\n        end = pos + len(word)\n        for a, b in spans:\n            if pos < b and end > a:\n                return\n        spans.append((pos, end))\n        s = max(0, pos - 12)\n        e = min(len(body), pos + len(word) + 12)\n        ctx = body[s:e].replace(\"\\n\", \" \")\n        hits.append({\"类型\": kind, \"命中\": word, \"上下文\": ctx})\n\n    for pat in rules[\"极限词\"]:\n        for m in re.finditer(pat, body):\n            add(\"广告法极限词\", m.group(0), m.start())\n    for pat in rules[\"医疗用语\"]:\n        for m in re.finditer(pat, body):\n            add(\"医疗用语\", m.group(0), m.start())\n    for cat, pats in rules[\"功效词\"].items():\n        if cat in approved_cats:\n            continue\n        for pat in pats:\n            for m in re.finditer(pat, body):\n                add(f\"超出批准功效（{cat}）\", m.group(0), m.start())\n    for pat in rules[\"竞品对比\"]:\n        for m in re.finditer(pat, body):\n            add(\"贬低竞品\", m.group(0), m.start())\n    if prod[\"资质类型\"] != \"保健食品\":\n        for pat in rules[\"普通食品冒充保健\"]:\n            for m in re.finditer(pat, body):\n                add(\"普通食品不得称保健品\", m.group(0), m.start())\n    missing_decl = prod[\"资质类型\"] == \"保健食品\" and decl not in (text or \"\")\n    return hits, missing_decl\n\n\ndef fmt(hits, missing_decl, decl):\n    lines = []\n    for i, h in enumerate(hits, 1):\n        lines.append(f\"{i}. [{h['类型']}] 「{h['命中']}」… {h['上下文']} …\")\n    if missing_decl:\n        lines.append(f\"{len(hits) + 1}. [缺少规定声明] 保健食品内容必须包含「{decl}」\")\n    return \"\\n\".join(lines) if lines else \"无命中\"\n\n\ndef main(draft: str, product_json: str, rules_json: str) -> dict:\n    prod = json.loads(product_json)\n    rules = json.loads(rules_json)\n    draft = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", draft or \"\")\n    hits, missing = scan(draft, prod, rules)\n    n = len(hits) + (1 if missing else 0)\n    return {\"rule_hits\": fmt(hits, missing, rules[\"保健食品声明\"]), \"hit_count\": str(n)}\n", "variables": [{"variable": "draft", "value_selector": ["start", "text"], "value_type": "string"}, {"variable": "product_json", "value_selector": ["a_data", "product_json"], "value_type": "string"}, {"variable": "rules_json", "value_selector": ["a_data", "rules_json"], "value_type": "string"}], "outputs": {"rule_hits": {"type": "string", "children": null}, "hit_count": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 720, "y": 280}, "positionAbsolute": {"x": 720, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "f_review", "type": "custom", "data": {"type": "llm", "title": "F 合规审核Agent", "desc": "和主流程同一份提示词", "model": {"provider": "langgenius/deepseek/deepseek", "name": "deepseek-v4-flash", "mode": "chat", "completion_params": {"temperature": 0.2}}, "prompt_template": [{"id": "sys-f", "role": "system", "text": "你是「元养」品牌的合规审核Agent，负责在内容交给设计师之前做语义层面的合规审核，并直接给出改好的终稿。\n\n## 审核依据\n1. 广告法：不得使用绝对化用语；不得贬低其他生产经营者的商品。\n2. 食品（包括保健食品）广告不得涉及疾病预防、治疗功能，不得使用医疗用语或易与药品混淆的用语。\n3. 普通食品不得宣称任何保健功能，也不得暗示；保健食品只能宣称批准的保健功能，表述要与批准原文一致，并须包含「本品不能代替药物」。\n4. 不得用「消费者感受」「买家说」等形式变相宣称功效（例如\"姐妹们都说喝了换季不感冒\"）。\n5. 不得制造焦虑、夸大效果或作出效果保证（例如\"喝一周就能看到变化\"）。\n\n## 你会收到\n- 商品资料：资质、批准功效、商品参数（改写时只能用这里有的信息）\n- 规则初检结果：规则引擎已经扫出的命中词，这些必须全部改掉\n- 内容初稿\n\n## 你要做的\n1. 先改掉规则命中的每一处；\n2. 再找规则扫不出来的问题：暗示功效、变相宣称、夸大、诱导、和资质不符的表述。标题、正文、话题标签、脚本画面、主图文案要逐项审；用谐音、昵称、emoji 暗示功效（例如「噗噗顺畅」），或用前后对比画面暗示效果（例如疲惫→精神饱满、暗沉→白皙），同样属于暗示功效，必须改；\n3. 修改时保留原文的结构、语气和卖点，只动有问题的句子，不要整段重写；遇到竞品对比，直接删掉比较的部分，不要改写成「同类产品」「市面上」这类中性对比；改写后的句子不能保留原句的暗示（例如把「一堆药」换成「瓶瓶罐罐」，或者保留「熬夜加班必备」这种功效场景）；也不能编造商品资料里没有的信息（包装形式、规格、成分）。拿不准怎么改，就删掉这句；\n4. 运营补充要求不能凌驾合规；\n5. 如果初稿没有问题，审核结论写「通过」，终稿原样照抄。\n\n## 输出格式（严格按这三个小节，终稿放最后）\n【审核结论】通过 或 已修改（共 N 处）\n【修改说明】\n- 原句：…… → 改为：…… ｜原因：……\n（每条修改说明一行，原因控制在 40 字以内，不要写思考过程；没有修改就写\"无\"）\n【终稿】\n（完整的终稿，保留初稿里所有【】小节，包括【主图需求单】）\n"}, {"id": "user-f", "role": "user", "text": "商品资料：\n{{#a_data.dossier#}}\n\n规则初检结果（命中 {{#e_rules.hit_count#}} 处）：\n{{#e_rules.rule_hits#}}\n\n内容初稿：\n{{#start.text#}}"}], "context": {"enabled": false, "variable_selector": []}, "vision": {"enabled": false}, "variables": [], "reasoning_format": "separated", "selected": false}, "position": {"x": 1040, "y": 380}, "positionAbsolute": {"x": 1040, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "q_eval", "type": "custom", "data": {"type": "code", "title": "Q 评测结果", "desc": "终稿复检，输出评测字段", "code_language": "python3", "code": "# 节点Q 评测结果（代码执行）——只用于「合规关卡-评测」工作流\n# 作用：输入一条现成文案，跑「规则初检 → 合规审核Agent → 终稿复检」，\n#       输出规则层是否命中、模型是否修改、终稿是否还有命中，方便统计拦截率和误拦率。\nimport json\nimport re\n\n\ndef scan(text, prod, rules):\n    hits = []\n    decl = rules[\"保健食品声明\"]\n    body = (text or \"\").replace(decl, \"\")\n    if prod[\"资质类型\"] == \"保健食品\":\n        for ph in rules.get(\"法定用语\", []):\n            body = body.replace(ph, \"\")\n    approved_cats = [rules[\"批准功效映射\"].get(x, x) for x in prod[\"批准功效\"]]\n    spans = []\n\n    def add(kind, word, pos):\n        end = pos + len(word)\n        for a, b in spans:\n            if pos < b and end > a:\n                return\n        spans.append((pos, end))\n        hits.append(f\"[{kind}]{word}\")\n\n    for pat in rules[\"极限词\"]:\n        for m in re.finditer(pat, body):\n            add(\"极限词\", m.group(0), m.start())\n    for pat in rules[\"医疗用语\"]:\n        for m in re.finditer(pat, body):\n            add(\"医疗用语\", m.group(0), m.start())\n    for cat, pats in rules[\"功效词\"].items():\n        if cat in approved_cats:\n            continue\n        for pat in pats:\n            for m in re.finditer(pat, body):\n                add(\"超出批准功效\", m.group(0), m.start())\n    for pat in rules[\"竞品对比\"]:\n        for m in re.finditer(pat, body):\n            add(\"贬低竞品\", m.group(0), m.start())\n    if prod[\"资质类型\"] != \"保健食品\":\n        for pat in rules[\"普通食品冒充保健\"]:\n            for m in re.finditer(pat, body):\n                add(\"普通食品称保健\", m.group(0), m.start())\n    missing_decl = prod[\"资质类型\"] == \"保健食品\" and decl not in (text or \"\")\n    return hits, missing_decl\n\n\ndef _section(text, name):\n    m = re.search(r\"【\" + name + r\"】\\s*([\\s\\S]*?)(?=\\n【[^】]+】|\\Z)\", text or \"\")\n    return m.group(1).strip() if m else \"\"\n\n\ndef main(review_text: str, original: str, product_json: str, rules_json: str, hit_count: str, rule_hits: str) -> dict:\n    prod = json.loads(product_json)\n    rules = json.loads(rules_json)\n    decl = rules[\"保健食品声明\"]\n    review_text = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", review_text or \"\")\n    verdict = _section(review_text, \"审核结论\")\n    final = review_text.split(\"【终稿】\", 1)[1].strip() if \"【终稿】\" in review_text else \"\"\n    if not final:\n        final = original or \"\"\n    hits, missing = scan(final, prod, rules)\n    auto_fix = False\n    if missing:\n        final = final.rstrip() + f\"（{decl}）\"\n        auto_fix = True\n    result = {\n        \"规则初检命中\": int(hit_count or 0),\n        \"模型结论\": \"已修改\" if \"已修改\" in verdict else (\"通过\" if \"通过\" in verdict else verdict[:20]),\n        \"终稿复检命中\": len(hits),\n        \"终稿复检明细\": hits,\n        \"自动补声明\": auto_fix,\n        \"终稿\": final,\n    }\n    changes = _section(review_text, \"修改说明\") or \"无\"\n    caught = int(hit_count or 0) > 0 or result[\"模型结论\"] == \"已修改\"\n    report = f\"\"\"# 合规关卡评测｜{prod['名称']}\n\n**是否判定违规：{'是' if caught else '否'}**　｜　规则初检命中 {result['规则初检命中']} 处　｜　合规审核Agent：{result['模型结论']}　｜　终稿复检命中 {result['终稿复检命中']} 处\n\n## 原文\n{original}\n\n## ① 规则初检\n{rule_hits}\n\n## ② 合规审核Agent 修改说明\n{changes}\n\n## ③ 终稿（已复检{'，已自动补规定声明' if auto_fix else ''}）\n{final}\n\n---\n评测记录：{json.dumps({k: v for k, v in result.items() if k != '终稿'}, ensure_ascii=False)}\n\"\"\"\n    return {\"report\": report, \"eval_json\": json.dumps(result, ensure_ascii=False)}\n", "variables": [{"variable": "review_text", "value_selector": ["f_review", "text"], "value_type": "string"}, {"variable": "original", "value_selector": ["start", "text"], "value_type": "string"}, {"variable": "product_json", "value_selector": ["a_data", "product_json"], "value_type": "string"}, {"variable": "rules_json", "value_selector": ["a_data", "rules_json"], "value_type": "string"}, {"variable": "hit_count", "value_selector": ["e_rules", "hit_count"], "value_type": "string"}, {"variable": "rule_hits", "value_selector": ["e_rules", "rule_hits"], "value_type": "string"}], "outputs": {"report": {"type": "string", "children": null}, "eval_json": {"type": "string", "children": null}}, "selected": false}, "position": {"x": 1360, "y": 280}, "positionAbsolute": {"x": 1360, "y": 280}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}, {"id": "end", "type": "custom", "data": {"type": "end", "title": "结束", "desc": "", "outputs": [{"variable": "report", "value_selector": ["q_eval", "report"], "value_type": "string"}], "selected": false}, "position": {"x": 1680, "y": 380}, "positionAbsolute": {"x": 1680, "y": 380}, "width": 244, "height": 90, "sourcePosition": "right", "targetPosition": "left", "selected": false}], "edges": [{"id": "start-source-a_data-target", "source": "start", "sourceHandle": "source", "target": "a_data", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "start", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "a_data-source-e_rules-target", "source": "a_data", "sourceHandle": "source", "target": "e_rules", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "e_rules-source-f_review-target", "source": "e_rules", "sourceHandle": "source", "target": "f_review", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "llm", "isInIteration": false, "isInLoop": false}}, {"id": "f_review-source-q_eval-target", "source": "f_review", "sourceHandle": "source", "target": "q_eval", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "llm", "targetType": "code", "isInIteration": false, "isInLoop": false}}, {"id": "q_eval-source-end-target", "source": "q_eval", "sourceHandle": "source", "target": "end", "targetHandle": "target", "type": "custom", "zIndex": 0, "data": {"sourceType": "code", "targetType": "end", "isInIteration": false, "isInLoop": false}}], "viewport": {"x": 0, "y": 0, "zoom": 0.8}}}}